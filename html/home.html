<!-- =========================
     HOME — HERO
========================== -->

<main class="hero" id="home">

    <div class="hero-inner">

           <!-- HERO COPY -->

        <section class="hero-text">

            <h1>
                REX LATAYADA
            </h1>

            <h2>
                IoT and Software developer
            </h2>

            <p>
                Passionate about IoT, software development, and
                creating applications that make technology more
                useful.
            </p>

            <div class="hero-actions">
                <a class="hero-btn hero-btn-primary" href="assets/files/Rex_Latayada_CV.pdf" download>
                    Download CV
                </a>
                <a class="hero-btn hero-btn-secondary" href="#contact" data-target="contact">
                    Contact
                </a>
            </div>

        </section>


        <!-- GRAPHICS STAGE -->

        <div class="hero-stage">

              <!-- ROBOT CARS -->
            <div
                class="car-lane"
                role="img"
                aria-label="IoT four-wheel robot car driving to the right"
            >

                <ul class="car-convoy">

                    <li class="robot-car robot-car--lead">
                        <img src="assets/images/body.png" class="robot-body" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-rear" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-front" alt="">
                    </li>

                    <li class="robot-car robot-car--mid" aria-hidden="true">
                        <img src="assets/images/body.png" class="robot-body" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-rear" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-front" alt="">
                    </li>

                    <li class="robot-car robot-car--tail" aria-hidden="true">
                        <img src="assets/images/body.png" class="robot-body" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-rear" alt="">
                        <img src="assets/images/wheel.png" class="robot-wheel robot-wheel-front" alt="">
                    </li>

                </ul>

            </div>


            <!-- LED SIGNAL -->
            <div
                class="led-group"
                role="img"
                aria-label="Red, yellow and green LED indicators"
            >

                <div class="led red">
                    <span class="glow"></span>
                    <img src="assets/images/led1.png" class="led-image" alt="">
                </div>

                <div class="led yellow">
                    <span class="glow"></span>
                    <img src="assets/images/led2.png" class="led-image" alt="">
                </div>

                <div class="led green">
                    <span class="glow"></span>
                    <img src="assets/images/led3.png" class="led-image" alt="">
                </div>

            </div>

        </div>

    </div>

</main>
