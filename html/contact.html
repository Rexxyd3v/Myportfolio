<!-- =========================
     CONTACT
========================== -->

<section class="section-content section-contact" id="contact">
    <div class="section-container">
        <div class="contact-grid">
            <div class="section-card contact-info">
                <h2>Contact Me</h2>
                <p>For project inquiries, internship opportunities, or questions about my work, email me directly.</p>

                <div class="info-items">
                    <div class="info-item">
                        <a class="info-text" href="mailto:rexjemar@gmail.com">rexjemar@gmail.com</a>
                    </div>
                    <div class="info-item">
                        <span class="info-text">Philippines</span>
                    </div>
                </div>
            </div>

            <div class="section-card contact-form-card">
                <form class="contact-form" action="https://formspree.io/f/myeygogb" method="POST">
                    <div class="form-group">
                        <label for="form-email">Email address</label>
                        <input type="email" id="form-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="form-subject">Subject</label>
                        <input type="text" id="form-subject" name="subject" placeholder="Project inquiry" required>
                    </div>
                    <div class="form-group">
                        <label for="form-message">Message</label>
                        <textarea id="form-message" name="message" rows="5" placeholder="Tell me about your project or question." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send email</button>
                    <p class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </div>
    </div>
</section>
